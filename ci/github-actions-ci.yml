name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Small end-to-end run (synthetic data)
        env:
          GAW_PROFILE: small
        run: |
          python -m src.generate
          python -m src.pipeline
          python -m src.model
          python -m src.analysis.run_all --no-images
      - name: Leak scan
        run: bash scripts/leak_scan.sh
